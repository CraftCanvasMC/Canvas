syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "SystemProtos";

// "system", written once, in the first part
message SystemInfo {
    Cpu cpu = 1;
    Memory memory = 2;
    Os os = 3;
    Jvm jvm = 4;
    repeated Disk disks = 5;

    message Cpu {
        string model = 1;
        int32 logical_cores = 2;
        int32 physical_cores = 3;
        string arch = 4;
        double max_frequency_mhz = 5;
    }

    message Memory {
        sint64 physical_total = 1;
        sint64 physical_free = 2;
        sint64 swap_total = 3;
        sint64 swap_free = 4;
    }

    message Os {
        string name = 1;
        string version = 2;
        string arch = 3;
        string distribution = 4;
        string kernel = 5;
        double load_average = 6;
    }

    message Jvm {
        string vm_name = 1;
        string vm_vendor = 2;
        string vm_version = 3;
        string java_version = 4;
        string runtime_version = 5;
        repeated string input_arguments = 6;
        int64 start_epoch_millis = 7;
        int64 uptime_ms = 8;
        repeated string garbage_collectors = 9;
        sint64 heap_init = 10;
        sint64 heap_max = 11;
        int32 available_processors = 12;
    }

    message Disk {
        string path = 1;
        int64 total = 2;
        int64 usable = 3;
    }
}
