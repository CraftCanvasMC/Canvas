syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "NetworkProtos";

message Network {
    repeated PacketType packet_types = 1;
    repeated string interfaces = 2;
    repeated NetworkSample samples = 3;
    repeated InterfaceSample interface_samples = 4;
}

message PacketType {
    string name = 1;
    Direction direction = 2;

    enum Direction {
        DIRECTION_UNSPECIFIED = 0;
        DIRECTION_INBOUND = 1;
        DIRECTION_OUTBOUND = 2;
    }
}

message NetworkSample {
    int64 time_us = 1;
    sint64 handle = 2;
    int64 bytes_in = 3;
    int64 bytes_out = 4;
    int64 packets_in = 5;
    int64 packets_out = 6;
    sint32 connections = 7;
    repeated int32 type = 8;
    repeated int64 type_count = 9;
}

message InterfaceSample {
    int64 time_us = 1;
    repeated sint64 rx_bytes = 2;
    repeated sint64 rx_packets = 3;
    repeated sint64 tx_bytes = 4;
    repeated sint64 tx_packets = 5;
}
