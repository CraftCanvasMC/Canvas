syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "ReportProtos";

message Report {
    int32 format_version = 1;
    repeated Section sections = 2;
}

message Section {
    // the module id. built in: metadata, timeline, samples, server, network, gc, system, configs.
    // ids starting with _ are internal and never end up in a report
    string id = 1;
    // the module message, serialized
    bytes data = 2;
}

// "_part", written into every part file on disk, never into a report
message PartInfo {
    int32 index = 1;
    int64 from_us = 2;
    int64 to_us = 3;
}
