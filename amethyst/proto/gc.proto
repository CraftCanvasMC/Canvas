syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "GcProtos";

// every GC collection, in the order the JVM reported them
message Gc {
    repeated GcEvent events = 1;
}

message GcEvent {
    int64 id = 1;
    int64 start_us = 2;
    int64 duration_us = 3;
    string name = 4;
    string action = 5;
    string cause = 6;
    // heap pools only, freed = before - after
    int64 heap_before = 7;
    int64 heap_after = 8;
    repeated Pool pools = 9;

    message Pool {
        string name = 1;
        int64 before = 2;
        int64 after = 3;
    }
}
