syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "TimelineProtos";

// "timeline", what every handle did and how regions changed
message Timeline {
    // appended as first seen
    repeated World worlds = 1;
    repeated Handle handles = 2;
    repeated RegionEvent events = 3;
    repeated string metric_names = 4;
    repeated MetricRow metric_rows = 5;
}

message World {
    // id, like minecraft:overworld
    string key = 1;
    string name = 2;
}

message Handle {
    sint64 id = 1;
    Kind kind = 2;
    // index into worlds
    sint32 world = 3;
    int64 first_seen_us = 4;
    int64 last_seen_us = 5;
    // one row per tick
    repeated sint64 tick_start_us_delta = 6;
    repeated int64 tick_duration_us = 7;
    // every runTasks between the end of this tick and the start of the next one, combined
    repeated int64 tasks_ns = 8;
    repeated int32 tasks_runs = 9;
    // runTasks before the first tick, only in the entry that has the handle's first tick
    int64 leading_tasks_ns = 10;
    int32 leading_tasks_runs = 11;

    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_GLOBAL = 1;
        KIND_REGION = 2;
    }
}

message RegionEvent {
    int64 time_us = 1;
    Type type = 2;
    // index into worlds
    sint32 world = 3;
    sint64 handle = 4;
    // merge: the region merged into, split: the regions split into
    repeated sint64 related = 5;
    // the shapes after the event, one per region involved
    repeated RegionShape shapes = 6;

    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_CREATE = 1;
        TYPE_DESTROY = 2;
        TYPE_ACTIVE = 3;
        TYPE_INACTIVE = 4;
        TYPE_MERGE = 5;
        TYPE_SPLIT = 6;
    }
}

// in chunk coordinates
message RegionShape {
    sint64 handle = 1;
    sint32 center_chunk_x = 2;
    sint32 center_chunk_z = 3;
    sint32 min_chunk_x = 4;
    sint32 min_chunk_z = 5;
    sint32 max_chunk_x = 6;
    sint32 max_chunk_z = 7;
    int32 chunks = 8;
    int32 sections = 9;
}

// one row per handle every metric interval
message MetricRow {
    int64 time_us = 1;
    sint64 handle = 2;
    // aligned with metric_names
    repeated sint64 values = 3;
    RegionShape shape = 4;
}
