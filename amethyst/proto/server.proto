syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "ServerProtos";

message Server {
    repeated string platform_metric_names = 1;
    repeated string memory_pool_names = 2;
    repeated ServerSample samples = 3;
}

message ServerSample {
    int64 time_us = 1;
    // 0 to 1
    double process_cpu = 2;
    double system_cpu = 3;
    sint64 heap_used = 4;
    sint64 heap_committed = 5;
    sint64 heap_max = 6;
    sint64 non_heap_used = 7;
    // since the previous sample
    int64 allocated = 8;
    int32 thread_count = 9;
    int32 daemon_thread_count = 10;
    sint64 physical_free = 11;
    double load_average = 12;
    // aligned with memory_pool_names
    repeated sint64 pool_used = 13;
    repeated sint64 pool_committed = 14;
    // aligned with platform_metric_names
    repeated sint64 platform_metrics = 15;
    // since the previous sample
    int64 gc_count = 16;
    int64 gc_time_ms = 17;
}
