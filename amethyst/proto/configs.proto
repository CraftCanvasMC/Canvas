syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "ConfigsProtos";

message Configs {
    repeated ConfigFile files = 1;
}

message ConfigFile {
    string path = 1; // relative to server dir
    string json = 2; // file converted to json
}
