syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "SamplesProtos";

message Samples {
    // the tables only append
    repeated string strings = 1;
    repeated Frame frames = 2;
    repeated int32 node_parent_distance = 3;
    repeated int32 node_frame = 4;
    repeated ThreadInfo threads = 5;
    SampleSet cpu = 6;
    SampleSet allocation = 7;
    SampleSet lock = 8;
    // index 0 is the server itself
    repeated Source sources = 9;
}

message Frame {
    // string indices
    int32 class_name = 1;
    int32 method_name = 2;
    int32 signature = 3;
    int32 line = 4;
    Type type = 5;
    // index into sources
    int32 source = 6;

    // numbered like async-profiler's frame types, plus one, so mapping is a single add
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_INTERPRETED = 1;
        TYPE_JIT = 2;
        TYPE_INLINED = 3;
        TYPE_NATIVE = 4;
        TYPE_CPP = 5;
        TYPE_KERNEL = 6;
        TYPE_C1 = 7;
    }
}

message ThreadInfo {
    int64 java_id = 1;
    int32 native_id = 2;
    string name = 3;
    // runs handles, so its samples are attributed to handles instead of the thread
    bool game = 4;
}

// one row per sample, sort by time
message SampleSet {
    bool enabled = 1;
    repeated sint64 time_us_delta = 2;
    repeated sint32 stack = 3;
    repeated int32 thread = 4;
    repeated sint64 handle = 5;
    repeated Phase phase = 6;
    // cpu and lock: nanoseconds, allocation: bytes
    repeated int64 value = 7;
    // allocated or locked class, string index
    repeated sint32 class_name = 8;

    enum Phase {
        // outside any handle
        PHASE_NONE = 0;
        PHASE_TICK = 1;
        PHASE_TASKS = 2;
    }
}

message Source {
    string name = 1;
    string version = 2;
    string description = 3;
    repeated string authors = 4;
    Kind kind = 5;

    enum Kind {
        KIND_UNSPECIFIED = 0;
        KIND_INTERNALS = 1;
        KIND_PLUGIN = 2;
        KIND_LIBRARY = 3;
    }
}
