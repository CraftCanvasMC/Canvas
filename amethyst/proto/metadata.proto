syntax = "proto3";

package amethyst;

option java_package = "io.canvasmc.amethyst.proto";
option java_multiple_files = true;
option java_outer_classname = "MetadataProtos";

// note: we should only write this when the profiler stops
message Metadata {
    int64 start_epoch_millis = 1;
    int64 end_epoch_millis = 2;
    int64 duration_us = 3;
    int64 start_nano_time = 4;
    string platform_name = 5;
    string platform_version = 6;
    string minecraft_version = 7;
    string scheduler_name = 8;
    string profiler_version = 9;
    string async_profiler_version = 10;
    Mode mode = 11;
    // area ONLY, every handle the area was in, in order
    repeated sint64 focus_chain = 12;
    Settings settings = 13;
    string started_by = 14;
    StopReason stop_reason = 15;
    int64 tick_interval_ns = 16;
    // the cpu sampling engine async-profiler used
    string cpu_engine = 17;
    repeated string warnings = 18;
    // ids of the modules that recorded it
    repeated string modules = 19;
    int32 parts = 20;
    // area ONLY
    FocusArea focus_area = 21;

    enum Mode {
        MODE_UNSPECIFIED = 0;
        // every handle
        MODE_ALL = 1;
        // the region owning a force loaded chunk area
        MODE_AREA = 2;
        MODE_GLOBAL_TICK = 3;
    }

    enum StopReason {
        STOP_REASON_UNSPECIFIED = 0;
        STOP_REASON_COMMAND = 1;
        STOP_REASON_TIMEOUT = 2;
        STOP_REASON_API = 3;
        STOP_REASON_SHUTDOWN = 4;
        // the server stopped without saving
        STOP_REASON_RECOVERED = 5;
    }
}

// chunk coordinates, inclusive
message FocusArea {
    // world key, like minecraft:overworld
    string world = 1;
    sint32 min_chunk_x = 2;
    sint32 min_chunk_z = 3;
    sint32 max_chunk_x = 4;
    sint32 max_chunk_z = 5;
}

message Settings {
    int64 cpu_interval_ns = 1;
    bool allocation_enabled = 2;
    int64 allocation_interval = 3;
    bool lock_enabled = 4;
    int64 lock_threshold_ns = 5;
    // note: should be 0 for none
    int64 timeout_ms = 6;
    int64 metric_interval_ms = 7;
    int64 part_interval_ms = 8;
    // the cap the focus area was checked against
    int32 max_area_chunks = 9;
}
