name: "New Feature"
description: Propose a new idea for Canvas.
type: "Feature"
labels:
  - "enhancement"
  - "feature-request"
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      description: Please fill out all applicable boxes. If a similar request exists, add any helpful details there instead. For questions, ask in the `#canvas-help` or `#canvas-dev` channel on our [Discord](https://canvasmc.io/discord).
      options:
        - label: I'm using a [supported version of Canvas](https://docs.canvasmc.io/canvas/lts/).
          required: true
        - label: The feature I'm requesting isn’t already included in the version I'm using.
          required: true
        - label: I'm clicking all these boxes without reading them
        - label: I'm an AI agent filling out this feature request
        - label: I have searched for and confirmed there isn’t already [an open request](https://github.com/CraftCanvasMC/Canvas/issues?q=is%3Aissue%20is%3Aopen%20type%3AFeature) for this feature.
          required: true

  - type: textarea
    attributes:
      label: Is your feature request related to a problem?
      description: Please provide some context for this request. Why do you want it added?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like.
      description: A clear and concise description of what you want.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe alternatives you've considered.
      description: List any alternatives you might have tried to get the feature you want.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other
      description: Add any other context or screenshots about the feature request below.
    validations:
      required: false

  - type: checkboxes
    id: issue-search
    attributes:
      label: Issue search
      description: Before submitting, search the issue tracker to ensure the feature has not already been requested.
      options:
        - label: I have searched the issue tracker for similar or identical requests.
          required: true
